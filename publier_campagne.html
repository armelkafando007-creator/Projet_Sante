<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="robots" content="noindex">
        <title>Publier une campagne — SangSanté</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <header>
            <h1>SangSanté</h1>
            <button class="bouton_menu" id="bouton_menu" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="menu_principal">☰</button>
            <nav id="menu_principal">
                <a href="index.html">Accueil</a>
                <a href="demandes_actives.html">Demandes</a>
                <a href="statistiques.html">Statistiques</a>
                <a href="actualites.html">Actualités</a>
                <a href="aide.html">Aide</a>
                <a href="a_propos.html">À propos</a>
                <a href="contact.html">Contact</a>
                <a href="tableau_de_bord_etablissement.html">Mon espace</a>
            </nav>
        </header>
        <main>
            <section id="publier_campagne">
                <h2>Publier une campagne de don</h2>
                <p>Votre campagne sera visible publiquement sur la page Actualités dès sa publication.</p>
                <form>
                    <label for="titre_campagne">Titre de la campagne</label>
                    <input type="text" id="titre_campagne" name="titre_campagne" placeholder="Ex. Collecte mobile au quartier Tanghin" required>
                    <label for="date_debut">Date de début</label>
                    <input type="date" id="date_debut" name="date_debut" required>
                    <label for="date_fin">Date de fin</label>
                    <input type="date" id="date_fin" name="date_fin" required>
                    <label for="lieu_campagne">Lieu</label>
                    <input type="text" id="lieu_campagne" name="lieu_campagne" required>
                    <label for="description_campagne">Description</label>
                    <textarea id="description_campagne" name="description_campagne" rows="4" placeholder="Détails pratiques : horaires, public visé, comment participer..." required></textarea>
                    <button type="submit">Publier la campagne</button>
                </form>
            </section>
        </main>
        <footer>
            <p>Contact : contact@sangsante.exemple</p>
        </footer>
        <script src="js/script.js"></script>
    </body>
</html>
